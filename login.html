<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>NivxBoost - Sign In</title>
  <meta name="description" content="NivxBoost Command Center - Sign in with Google">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0b141c">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0b141c;
      color: #dae3ee;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      overflow: hidden;
    }

    /* Ambient glows */
    .glow-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .glow-bg::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 20%;
      width: 400px;
      height: 400px;
      background: #00e5ff;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.08;
    }
    .glow-bg::after {
      content: '';
      position: absolute;
      bottom: 20%;
      right: 20%;
      width: 450px;
      height: 450px;
      background: #00daf3;
      border-radius: 50%;
      filter: blur(160px);
      opacity: 0.06;
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      background: #182028;
      border: 1px solid #3b494c;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 1px rgba(0, 229, 255, 0.2);
      text-align: center;
    }

    /* Cyan top stripe */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00e5ff, transparent);
      border-radius: 20px 20px 0 0;
      opacity: 0.8;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #222b33;
      border: 1px solid #3b494c;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
      margin-bottom: 1rem;
    }

    .logo-wrap svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #00daf3;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #bac9cc;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    .tls-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-family: monospace;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #222b33;
      border: 1px solid #3b494c;
      color: #00daf3;
      margin-bottom: 2rem;
      letter-spacing: 0.08em;
    }

    /* Real Google button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      background: #ffffff;
      color: #1f1f1f;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      letter-spacing: 0.02em;
    }

    .google-btn:hover {
      background: #f1f3f4;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .google-btn:active {
      transform: translateY(0);
    }

    .google-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .google-btn svg {
      flex-shrink: 0;
    }

    .loading-text {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: #849396;
      line-height: 1.6;
    }

    .footer-note a {
      color: #00daf3;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="glow-bg"></div>

  <div class="card">
    <!-- Logo -->
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" fill="#00daf3"/>
        <circle cx="12" cy="12" r="10" stroke="#00daf3" stroke-width="1" fill="none" opacity="0.3"/>
        <path d="M12 6 L18 10 L18 14 L12 18 L6 14 L6 10 Z" stroke="#00daf3" stroke-width="0.5" fill="none" opacity="0.4"/>
      </svg>
    </div>

    <h1>NIVXBOOST</h1>
    <p class="subtitle">Quantum Network Engine &bull; Command Center Access</p>

    <span class="tls-badge">&#x1F512; SECURE &bull; TLS 1.3</span>

    <!-- Google One Tap container -->
    <div id="g_id_onload"
      data-client_id="862048123632-vqdvasdfjcgr7et3eg5h8nqj61qbk01e.apps.googleusercontent.com"
      data-callback="handleGoogleCredential"
      data-auto_select="false"
      data-cancel_on_tap_outside="true"
      data-context="signin"
      style="display:none;">
    </div>

    <!-- Google Sign-In Button -->
    <button class="google-btn" id="googleSignInBtn" onclick="triggerGoogleSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <p class="footer-note">
      By signing in, you agree to NivxBoost's terms.<br>
      NivxBoost Core v4.8.9 &bull; Quantum Node Infrastructure
    </p>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '862048123632-vqdvasdfjcgr7et3eg5h8nqj61qbk01e.apps.googleusercontent.com';

    function parseJwt(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(base64));
      } catch (e) {
        return {};
      }
    }

    // Called by Google after successful sign-in
    function handleGoogleCredential(response) {
      const payload = parseJwt(response.credential);
      const name = payload.name || 'Google User';
      const email = payload.email || 'user@gmail.com';
      const picture = payload.picture || '';
      const googleId = payload.sub || '';

      const session = {
        name, email, picture,
        provider: 'google',
        googleId,
        token: response.credential,
        loggedIn: true,
        loginTime: Date.now()
      };
      localStorage.setItem('nivx_user_session', JSON.stringify(session));
      window.location.href = 'index.html';
    }

    function triggerGoogleSignIn() {
      const btn = document.getElementById('googleSignInBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-text">Connecting to Google...</span>';

      if (window.google && window.google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
          auto_select: false,
          cancel_on_tap_outside: true
        });
        google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // One Tap blocked — use popup OAuth flow
            google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: 'openid email profile',
              callback: (tokenResponse) => {
                if (tokenResponse.access_token) {
                  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                  })
                  .then(r => r.json())
                  .then(userInfo => {
                    const session = {
                      name: userInfo.name || 'Google User',
                      email: userInfo.email || 'user@gmail.com',
                      picture: userInfo.picture || '',
                      provider: 'google',
                      token: tokenResponse.access_token,
                      loggedIn: true,
                      loginTime: Date.now()
                    };
                    localStorage.setItem('nivx_user_session', JSON.stringify(session));
                    window.location.href = 'index.html';
                  })
                  .catch(() => resetBtn());
                } else {
                  resetBtn();
                }
              }
            }).requestAccessToken();
          }
        });
      } else {
        setTimeout(() => {
          resetBtn();
          alert('Google Sign-In is still loading, please try again.');
        }, 500);
      }
    }

    function resetBtn() {
      const btn = document.getElementById('googleSignInBtn');
      btn.disabled = false;
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg> Continue with Google`;
    }

    // Auto-show Google One Tap on load
    window.addEventListener('load', () => {
      if (window.google && window.google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
          auto_select: false
        });
        google.accounts.id.prompt();
      }
    });
  </script>
</body>

</html>
