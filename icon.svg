<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded cyber corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Outer Glowing Circuit Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-dasharray="24 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>

  <!-- Glowing Quantum Shield Emblem -->
  <g filter="url(#glow)">
    <path d="M 256 100 L 370 160 L 370 280 C 370 360 256 420 256 420 C 256 420 142 360 142 280 L 142 160 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Inner Cyber Lightning Bolt / N Symbol -->
    <path d="M 270 170 L 200 270 L 255 270 L 240 345 L 315 245 L 260 245 Z" 
          fill="url(#shieldGrad)"/>
  </g>

  <!-- Pulse dots -->
  <circle cx="256" cy="100" r="10" fill="#38bdf8"/>
  <circle cx="370" cy="160" r="8" fill="#10b981"/>
  <circle cx="142" cy="160" r="8" fill="#818cf8"/>
  <circle cx="256" cy="420" r="10" fill="#10b981"/>
</svg>
